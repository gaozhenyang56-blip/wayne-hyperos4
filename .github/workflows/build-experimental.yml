name: Build and publish offline experimental wayne package
# Source download: bounded retries, four range requests, complete SHA-256 verification.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-experimental.yml]
permissions:
  contents: write
concurrency:
  group: wayne-experimental-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      WAYNE_PROGRESS_FILE: docs/operations/github-build-${{ github.run_id }}.md
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight original source and publish result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          set +e
          python tools/record_step.py --action '检查供体原包分段入口。' --outcome '云端取得正确 ZIP 头和完整文件大小。' --failure-note '云端供体入口不可用，构建停止。' --next '预检成功后继续下载；失败时寻找可核验的原包镜像。' cloud-source-preflight -- python tools/preflight_source.py
          result=$?
          git add "$WAYNE_PROGRESS_FILE" logs
          git commit -m 'docs: record cloud source preflight'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
          exit "$result"
      - name: Prepare ephemeral runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config liblz4-dev liblzma-dev libzstd-dev uuid-dev zlib1g-dev g++
          python -m pip install -r requirements.txt gdown==5.2.0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Build, record progress and publish verified experimental assets
        run: python tools/ci_build_candidate.py
