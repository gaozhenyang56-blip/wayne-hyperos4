name: Ubuntu To Go Network Validation
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf libguestfs-tools linux-image-generic
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          sudo env LIBGUESTFS_BACKEND=direct libguestfs-test-tool
      - name: Restore installed image
        uses: actions/cache/restore@v4
        with:
          path: |
            ubuntu-build/ubuntu.qcow2
            ubuntu-build/image-complete.json
          key: ubuntu-installed-v1-${{ hashFiles('ubuntu-to-go/guest-build.sh') }}
          fail-on-cache-miss: true
      - name: Test normal network configuration in a disposable VM
        run: python3 ubuntu-network-test/network-test.py
      - name: Save network test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-network-validation
          path: |
            ubuntu-build/network-test/console.log
            ubuntu-build/network-test/NETWORK_TEST.json
          if-no-files-found: ignore
