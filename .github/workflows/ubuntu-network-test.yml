name: Ubuntu To Go Network Validation
on:
  push:
    branches: [ubuntu-to-go]
    paths: ['ubuntu-network-test/**', '.github/workflows/ubuntu-network-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf libguestfs-tools linux-image-generic
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          sudo env LIBGUESTFS_BACKEND=direct libguestfs-test-tool
      - name: Wait for target installation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 75); do
            state=$(gh run view 38598193677 --json status --jq .status)
            if [ "$state" = completed ]; then exit 0; fi
            sleep 45
          done
          exit 1
      - name: Restore installed image
        uses: actions/cache/restore@v4
        with:
          path: |
            ubuntu-build/ubuntu.qcow2
            ubuntu-build/image-complete.json
          key: ubuntu-installed-v1-${{ hashFiles('ubuntu-to-go/guest-build.sh') }}
          fail-on-cache-miss: true
      - name: Test normal network configuration in a disposable VM
        run: python3 ubuntu-network-test/network-test.py
      - name: Save network test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-network-validation
          path: |
            network-test/console.log
            network-test/NETWORK_TEST.json
          if-no-files-found: ignore
      - name: Attach passed test report to the matching image release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh run view 38598193677 --json number --jq .number)
          tag="ubuntu-to-go-20g-$number"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" network-test/NETWORK_TEST.json --clobber
          fi
